asyncapi: 3.0.0
info:
  title: Yijie Events
  version: 0.1.0
  description: Event contracts exchanged by Yijie services.
channels:
  taskEvents:
    address: task.events
    messages:
      taskEvent:
        $ref: "#/components/messages/TaskEvent"
  agentSessionEvents:
    address: agent.session.events
    messages:
      agentSessionEvent:
        $ref: "#/components/messages/AgentSessionEvent"
operations:
  receiveTaskEvents:
    action: receive
    channel:
      $ref: "#/channels/taskEvents"
    messages:
      - $ref: "#/channels/taskEvents/messages/taskEvent"
  receiveAgentSessionEvents:
    action: receive
    channel:
      $ref: "#/channels/agentSessionEvents"
    messages:
      - $ref: "#/channels/agentSessionEvents/messages/agentSessionEvent"
components:
  messages:
    TaskEvent:
      name: TaskEvent
      title: Agent task lifecycle event
      payload:
        type: object
        additionalProperties: false
        required: [task_id, status]
        properties:
          task_id:
            type: string
          status:
            type: string
            enum: [draft, running, waiting_approval, completed, failed]
          trace_id:
            type: string
          agent_session_id:
            type: string
          codex_thread_id:
            type: string
    AgentSessionEvent:
      name: AgentSessionEvent
      title: Ordered Agent Host session event
      summary: At-least-once event ordered by sequence within a single stream_id.
      payload:
        $ref: ../jsonschema/agent/session-event.schema.json
