asyncapi: 3.0.0
info:
  title: Yijie Events
  version: 0.6.0
  description: Event contracts exchanged by Yijie services.
channels:
  task.events:
    address: task.events
    messages:
      taskEvent:
        payload:
          type: object
          properties:
            task_id:
              type: string
  agentSessionEvents:
    address: agent.session.events
    description: >-
      Sanitized Agent Host events. Consumers order and resume events by
      stream_id plus sequence and deduplicate at-least-once delivery by event_id.
    messages:
      agentSessionEvent:
        $ref: "#/components/messages/AgentSessionEvent"
  agentSessionEventsV2:
    address: agent.session.events.v2
    description: >-
      Explicitly negotiated v2 Agent Host events. This stream preserves v1
      lifecycle events and adds bounded raw-reasoning text delta/finalized variants.
    messages:
      agentSessionEventV2:
        $ref: "#/components/messages/AgentSessionEventV2"
  agentSessionEventsV3:
    address: agent.session.events.v3
    description: >-
      Explicitly negotiated v3 Agent Host events. This stream preserves v2
      lifecycle and reasoning events and adds the closed structured-artifact
      lifecycle. Only the exact-local synthetic producer is authorized by this
      candidate; real provider/tool production remains closed.
    messages:
      agentSessionEventV3:
        $ref: "#/components/messages/AgentSessionEventV3"
  agentSessionEventsV4:
    address: agent.session.events.v4
    description: >-
      Explicitly negotiated v4 Agent Host events. This stream preserves every
      v3 variant and adds AgentMessage phase metadata plus authoritative stable
      plan snapshots. Body text is never a durable telemetry surface.
    messages:
      agentSessionEventV4:
        $ref: "#/components/messages/AgentSessionEventV4"
operations:
  receiveTaskEvents:
    action: receive
    channel:
      $ref: "#/channels/task.events"
    messages:
      - $ref: "#/channels/task.events/messages/taskEvent"
  receiveAgentSessionEvents:
    action: receive
    description: >-
      Receive one AgentSessionEvent at a time. A stream_id change starts a new
      ordering domain; it does not imply replay of events from an earlier Host process.
    channel:
      $ref: "#/channels/agentSessionEvents"
    messages:
      - $ref: "#/channels/agentSessionEvents/messages/agentSessionEvent"
  receiveAgentSessionEventsV2:
    action: receive
    description: >-
      Receive one AgentSessionEventV2 at a time after explicit schema-version-2
      negotiation. A stream_id change starts a new ordering domain. Delivery is
      at least once and consumers deduplicate by event_id.
    channel:
      $ref: "#/channels/agentSessionEventsV2"
    messages:
      - $ref: "#/channels/agentSessionEventsV2/messages/agentSessionEventV2"
  receiveAgentSessionEventsV3:
    action: receive
    description: >-
      Receive one AgentSessionEventV3 after explicit schema-version-3
      negotiation. A stream_id change starts a new ordering domain. Delivery is
      at least once and consumers deduplicate by event_id.
    channel:
      $ref: "#/channels/agentSessionEventsV3"
    messages:
      - $ref: "#/channels/agentSessionEventsV3/messages/agentSessionEventV3"
  receiveAgentSessionEventsV4:
    action: receive
    description: >-
      Receive one AgentSessionEventV4 after explicit schema-version-4
      negotiation. A plan event is one complete authoritative snapshot; a
      stream_id change starts a new ordering domain. Delivery is at least once
      and consumers deduplicate by event_id.
    channel:
      $ref: "#/channels/agentSessionEventsV4"
    messages:
      - $ref: "#/channels/agentSessionEventsV4/messages/agentSessionEventV4"
components:
  messages:
    AgentSessionEvent:
      name: AgentSessionEvent
      title: Ordered Agent Host session event
      summary: At-least-once event ordered by sequence within a single stream_id.
      description: >-
        JSON payload semantics are authoritative in the referenced JSON Schema.
        Protobuf message yijie.events.v1.AgentSessionEvent carries the equivalent
        service and asynchronous-consumer model.
      contentType: application/json
      correlationId:
        description: Agent Host session that owns the ordered event stream.
        location: $message.payload#/agent_session_id
      payload:
        $ref: ../jsonschema/agent/session-event.schema.json
    AgentSessionEventV2:
      name: AgentSessionEventV2
      title: Ordered Agent Host session event v2
      summary: V1 lifecycle plus bounded raw-reasoning text events.
      description: >-
        JSON payload semantics are authoritative in the referenced JSON Schema.
        Protobuf message yijie.events.v2.AgentSessionEvent carries the equivalent
        service and asynchronous-consumer model. Producers emit v2 only after the
        consumer explicitly negotiates schema version 2.
      contentType: application/json
      correlationId:
        description: Agent Host session that owns the ordered event stream.
        location: $message.payload#/agent_session_id
      payload:
        $ref: ../jsonschema/agent/session-event-v2.schema.json
    AgentSessionEventV3:
      name: AgentSessionEventV3
      title: Ordered Agent Host session event v3
      summary: V2 lifecycle and reasoning plus structured-artifact lifecycle.
      description: >-
        JSON payload semantics are authoritative in the referenced JSON Schema.
        Protobuf message yijie.events.v3.AgentSessionEvent carries the equivalent
        service and asynchronous-consumer model. Producers emit v3 only after the
        consumer explicitly negotiates schema version 3.
      contentType: application/json
      correlationId:
        description: Agent Host session that owns the ordered event stream.
        location: $message.payload#/agent_session_id
      payload:
        $ref: ../jsonschema/agent/session-event-v3.schema.json
    AgentSessionEventV4:
      name: AgentSessionEventV4
      title: Ordered Agent Host session event v4
      summary: V3 events plus AgentMessage phase and stable plan snapshots.
      description: >-
        JSON payload semantics are authoritative in the referenced JSON Schema.
        Protobuf message yijie.events.v4.AgentSessionEvent carries the equivalent
        service and asynchronous-consumer model. Producers emit v4 only after the
        consumer explicitly negotiates schema version 4.
      contentType: application/json
      correlationId:
        description: Agent Host session that owns the ordered event stream.
        location: $message.payload#/agent_session_id
      payload:
        $ref: ../jsonschema/agent/session-event-v4.schema.json
