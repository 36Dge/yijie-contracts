{
  "openapi": "3.0.3",
  "info": {"title": "Current native context window", "version": "0.2.0", "description": "Read-only projection of live and restored native statistics and contextCompaction items. No model request, resume, compaction command, token estimation or billing aggregation."},
  "servers": [{"url": "http://127.0.0.1"}],
  "security": [{"HostBearer": []}],
  "paths": {
    "/v1/agent-sessions/{agent_session_id}/context-window": {
      "get": {
        "operationId": "readContextWindow",
        "summary": "Read latest native context statistics and context lifecycle",
        "description": "Owner-only, no-store. Restore the latest persisted native statistics on a cold read, after verifying thread, measured turn, model revision and native context boundary. Repeated native rate-limit samples do not acquire a newer turn or model identity. Unknown or unprovable statistics remain null. include_history reads native items without invoking or resuming a model. Existing clients keep the same closed response shape.",
        "parameters": [
          {"name": "agent_session_id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}},
          {"name": "include_history", "in": "query", "schema": {"type": "boolean", "default": false}}
        ],
        "responses": {
          "200": {"description": "Current observation; null sample is unknown, not zero", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ContextWindowSnapshot"}}}},
          "400": {"description": "Invalid request"},
          "401": {"description": "Host authorization required"},
          "404": {"description": "Session not found"},
          "503": {"description": "Runtime unavailable"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {"HostBearer": {"type": "http", "scheme": "bearer"}},
    "schemas": {
      "ContextWindowQuery": {
        "type": "object", "additionalProperties": false,
        "description": "Private Desktop IPC payload inside the existing contextId/requestId envelope. sessionId is the local authorized session, never an arbitrary Runtime thread.",
        "required": ["sessionId", "includeHistory"],
        "properties": {"sessionId": {"type": "string", "format": "uuid"}, "includeHistory": {"type": "boolean"}}
      },
      "ContextWindowSample": {
        "type": "object", "additionalProperties": false,
        "required": ["used_tokens", "capacity_tokens", "turn_id", "window_id", "observed_at"],
        "properties": {
          "used_tokens": {"type": "integer", "format": "int64", "minimum": 0, "maximum": 9007199254740991, "description": "Native tokenUsage.last.totalTokens, never tokenUsage.total or a sum of requests. Includes all content counted by Runtime; may be a native recomputation after compaction. Display as latest statistics."},
          "capacity_tokens": {"type": "integer", "format": "int64", "minimum": 1, "maximum": 9007199254740991, "nullable": true, "description": "Same event's modelContextWindow: Runtime effective capacity, already adjusted by effective_context_window_percent. Null means unknown; no catalog fallback."},
          "turn_id": {"type": "string", "minLength": 1, "maxLength": 512},
          "window_id": {"type": "string", "format": "uuid", "description": "Disposable observation epoch, not a fabricated native window ID. Changes on model binding changes and native contextCompaction start."},
          "observed_at": {"type": "string", "format": "date-time", "description": "Time of the native observation. Restored samples retain the persisted native event timestamp, never the time the UI was reopened."}
        }
      },
      "ContextCompaction": {
        "type": "object", "additionalProperties": false,
        "description": "Original native contextCompaction identity. This native item does not distinguish summarization from new_context; display neutral context-update copy, never invent assistant text/phase or an automatic/manual cause.",
        "required": ["item_id", "turn_id", "state"],
        "properties": {
          "item_id": {"type": "string", "minLength": 1, "maxLength": 512},
          "turn_id": {"type": "string", "minLength": 1, "maxLength": 512},
          "state": {"type": "string", "enum": ["in_progress", "completed", "interrupted", "unknown"]}
        }
      },
      "ContextWindowSnapshot": {
        "type": "object", "additionalProperties": false,
        "required": ["schema_version", "thread_id", "model_profile", "model_revision", "sample", "compactions"],
        "properties": {
          "schema_version": {"type": "integer", "enum": [1]},
          "thread_id": {"type": "string", "maxLength": 512, "nullable": true},
          "model_profile": {"type": "string", "maxLength": 128, "nullable": true},
          "model_revision": {"type": "integer", "format": "int64", "minimum": 0, "maximum": 9007199254740991},
          "sample": {"type": "object", "allOf": [{"$ref": "#/components/schemas/ContextWindowSample"}], "nullable": true},
          "compactions": {"type": "array", "maxItems": 128, "items": {"$ref": "#/components/schemas/ContextCompaction"}}
        }
      }
    }
  }
}
