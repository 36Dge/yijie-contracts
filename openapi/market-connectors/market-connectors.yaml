            "minLength": 1,
            "maxLength": 160
          }
        },
        "description": "Safe display snapshot only, not a turn grant; old history cannot restore authority."
      },
      "SelectionValidation": {
        "type": "object",
        "additionalProperties": true,
        "required": [
          "selection",
          "executionAvailable"
        ],
        "properties": {
          "selection": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SelectionDisplay"
            },
            "maxItems": 58
          },
          "executionAvailable": {
            "type": "boolean"
          }
        },
        "description": "Successful validation is observational only. Does not mint a grant or authorize external side effects; submit must recheck atomically. Empty selection remains valid with execution unavailable."
      },
      "EmptyPayload": {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {}
      },
