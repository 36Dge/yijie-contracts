openapi: 3.0.3
info:
  title: Yijie Internal API
  version: 0.1.0
  description: Service-to-service API contract inside the Yijie trust boundary.
servers:
  - url: https://internal-api.yijie.ai
security: []
tags:
  - name: System
    description: Internal service health endpoints.
paths:
  /internal/healthz:
    get:
      operationId: getInternalHealth
      summary: Check internal API health
      tags: [System]
      responses:
        "200":
          description: Internal API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok, degraded]
