            }
          }
        },
        "responses": {
          "200": {
            "description": "The Runtime thread was resumed and session state refreshed.",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../agent-host/agent-host.yaml#/components/schemas/SessionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/SessionNotFound"
          },
          "409": {
            "description": "`session_not_usable`: the session has no Runtime thread that can be resumed.",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
