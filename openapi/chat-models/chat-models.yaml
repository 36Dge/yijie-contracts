    "/v1/model-chat/agent-sessions/{agent_session_id}/turns": {
      "post": {
        "operationId": "modelAwareStartAgentTurnV2",
        "summary": "Start an ordered multimodal turn",
        "description": "Starts one Runtime turn from an ordered, closed sequence of text, image,\nand file-context blocks. At most one turn may be active for a session.\nThe accepted response identifies the turn; progress and terminal state\nare delivered through the explicitly negotiated event stream.\n\nDesktop resolves attachment ownership, readiness, and seven-day expiry,\nand revalidates file size and SHA-256 against its local authority before\ncalling Host. Host treats every name and text value as untrusted,\nrevalidates each decoded image's media type, size, and digest, and does\nnot persist the data URL or context chunks in bbolt, replay, logs,\nmetrics, or traces. Files are represented only by Desktop-selected text\ncontext; raw file bytes and local paths are never accepted, so file size\nand digest remain Desktop-verified correlation metadata rather than Host\nauthorization input.\n\nA request may contain at most 10 image/file blocks. Decoded image bytes\nacross the complete turn must not exceed 10 MiB, and UTF-8 file context\nacross all file blocks must not exceed 256 KiB. Host enforces these\naggregate limits before invoking Runtime. They are semantic cross-block\nconstraints in addition to the per-field schema bounds.\n\n`operation_id` is scoped to the Agent session and the canonical ordered\ncontent blocks plus reasoning effort. Replaying the same operation and\ncanonical input returns the original accepted `turn_id` without invoking\nRuntime again. Reusing the operation ID with different canonical input\nreturns `turn_operation_conflict`.\n",
        "tags": [
          "Turns"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../agent-host/agent-host.yaml#/components/schemas/StartTurnV2Request"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "The Runtime accepted the ordered multimodal turn, or the original accepted result was replayed idempotently.",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../agent-host/agent-host.yaml#/components/schemas/StartTurnResponse"
                }
              }
            }
          },
          "400": {
            "description": "`invalid_request`: malformed or oversized JSON, an unknown field, an\ninvalid session identifier, an invalid content block, a mismatched\ndata-URL media type, size, or digest, more than 10 attachment blocks,\nan exceeded aggregate image/context limit, or an unsupported\nreasoning effort.\n",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../agent-host/agent-host.yaml#/components/schemas/ErrorResponse"
                },
                "example": {
                  "error": {
                    "code": "invalid_request",
                    "message": "request parameters are invalid"
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/SessionNotFound"
          },
          "409": {
            "description": "`turn_active` when another turn is active; `session_not_usable` when\nthe session has no usable Runtime thread; or\n`turn_operation_conflict` when an operation ID is reused with\ndifferent canonical input.\n",
            "x-yijie-error-codes": [
              "turn_active",
              "session_not_usable",
              "turn_operation_conflict"
            ],
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "../agent-host/agent-host.yaml#/components/schemas/ErrorResponse"
                    },
                    {
                      "$ref": "../agent-host/agent-host.yaml#/components/schemas/TurnOperationConflictError"
                    }
                  ]
                },
                "examples": {
                  "turnActive": {
                    "value": {
                      "error": {
                        "code": "turn_active",
                        "message": "agent session already has an active turn"
                      }
                    }
                  },
                  "sessionNotUsable": {
                    "value": {
                      "error": {
                        "code": "session_not_usable",
                        "message": "agent session cannot perform this operation"
                      }
                    }
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/InternalError"
          },
          "502": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/RuntimeRequestFailed"
          }
        },
        "parameters": [
          {
            "$ref": "../agent-host/agent-host.yaml#/components/parameters/AgentSessionId"
          },
          {
            "in": "header",
            "name": "X-Yijie-Model-Profile",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "kimi-k3-max-v1",
                "minimax-m3-high-v1"
              ]
            }
          }
        ],
        "x-source-operation": "../agent-host/agent-host.yaml#/paths/~1v2~1agent-sessions~1{agent_session_id}~1turns/post"
      }
    },
