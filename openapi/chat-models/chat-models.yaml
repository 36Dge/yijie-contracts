  "info": {
    "title": "Local chat model selection",
    "version": "0.1.0",
    "description": "FEAT-156 owner-only local model protocol. Model-aware paths reuse existing source payloads; X-Yijie-Model-Profile freezes the profile. Catalog/selection reads never call a provider. Selection requires idle native thread, expected revision and an operation ID. Unknown application blocks sending. Legacy writes stay MiniMax-only and reject model-managed sessions. No custom URL, key or effort from the renderer."
  },
