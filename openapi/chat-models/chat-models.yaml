    "/v1/model-chat/tasks/{task_id}/agent-sessions": {
      "post": {
        "operationId": "modelAwareStartAgentSession",
        "summary": "Start the Agent session for a task",
        "description": "Creates the one Agent session allowed for `task_id`, starts a persistent\nRuntime thread in `cwd`, and stores only the recovery mapping and status.\nA failed Runtime start can leave a queryable failed session reserved for\nthe task.\n",
        "tags": [
          "Sessions"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../agent-host/agent-host.yaml#/components/schemas/StartSessionRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "The session and Runtime thread were created and bound.",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../agent-host/agent-host.yaml#/components/schemas/SessionResponse"
                }
              }
            }
          },
          "400": {
            "description": "`invalid_request`: malformed or oversized JSON, an unknown field, an\ninvalid task identifier, or a `cwd` that is not an existing absolute\ndirectory.\n",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../agent-host/agent-host.yaml#/components/schemas/ErrorResponse"
                },
                "example": {
                  "error": {
                    "code": "invalid_request",
                    "message": "request parameters are invalid"
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/Unauthorized"
          },
          "409": {
            "description": "`task_session_exists`: the task already owns an Agent session.",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../agent-host/agent-host.yaml#/components/schemas/ErrorResponse"
                },
                "example": {
                  "error": {
                    "code": "task_session_exists",
                    "message": "task already has an agent session"
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/InternalError"
          },
          "502": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/RuntimeRequestFailed"
          }
        },
        "parameters": [
          {
            "$ref": "../agent-host/agent-host.yaml#/components/parameters/TaskId"
          },
          {
            "in": "header",
            "name": "X-Yijie-Model-Profile",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "kimi-k3-max-v1",
                "minimax-m3-high-v1"
              ]
            }
          }
        ],
        "x-source-operation": "../agent-host/agent-host.yaml#/paths/~1v1~1tasks~1{task_id}~1agent-sessions/post"
      }
    },
    "/v1/model-chat/agent-sessions/{agent_session_id}/resume": {
      "post": {
        "operationId": "modelAwareResumeAgentSession",
        "summary": "Resume the session's Runtime thread",
        "description": "Resumes the persisted Runtime thread mapping after a Runtime restart and\nrefreshes the current/last turn state. It does not restore SSE content\nfrom an earlier Host process.\n",
        "tags": [
          "Sessions"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../agent-host/agent-host.yaml#/components/schemas/TraceRequest"
