    "/v2/model-chat/agent-sessions/{agent_session_id}/turns": {
      "post": {
        "operationId": "modelAwareStartAgentTurnV2",
        "summary": "Start an ordered multimodal turn",
        "description": "Starts one Runtime turn from an ordered, closed sequence of text, image,\nand file-context blocks. At most one turn may be active for a session.\nThe accepted response identifies the turn; progress and terminal state\nare delivered through the explicitly negotiated event stream.\n\nDesktop resolves attachment ownership, readiness, and seven-day expiry,\nand revalidates file size and SHA-256 against its local authority before\ncalling Host. Host treats every name and text value as untrusted,\nrevalidates each decoded image's media type, size, and digest, and does\nnot persist the data URL or context chunks in bbolt, replay, logs,\nmetrics, or traces. Files are represented only by Desktop-selected text\ncontext; raw file bytes and local paths are never accepted, so file size\nand digest remain Desktop-verified correlation metadata rather than Host\nauthorization input.\n\nA request may contain at most 10 image/file blocks. Decoded image bytes\nacross the complete turn must not exceed 10 MiB, and UTF-8 file context\nacross all file blocks must not exceed 256 KiB. Host enforces these\naggregate limits before invoking Runtime. They are semantic cross-block\nconstraints in addition to the per-field schema bounds.\n\n`operation_id` is scoped to the Agent session and the canonical ordered\ncontent blocks plus reasoning effort. Replaying the same operation and\ncanonical input returns the original accepted `turn_id` without invoking\nRuntime again. Reusing the operation ID with different canonical input\nreturns `turn_operation_conflict`.\n Model admission runs before delegation. Model admission errors use the model-selection-v2 Error body: 400 invalid_request; 409 busy/revision_conflict/request_conflict/model_retired/selection_unknown; 503 model_unavailable/runtime_unavailable/activation_required. Original operation errors retain their original body.",
        "tags": [
          "Turns"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../agent-host/agent-host.yaml#/components/schemas/StartTurnV2Request"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "The Runtime accepted the ordered multimodal turn, or the original accepted result was replayed idempotently.",
            "headers": {
              "Cache-Control": {
                "$ref": "../agent-host/agent-host.yaml#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../agent-host/agent-host.yaml#/components/schemas/StartTurnResponse"
                }
              }
            }
          },
          "400": {
            "description": "Model admission or original operation error. `invalid_request`: malformed or oversized JSON, an unknown field, an\ninvalid session identifier, an invalid content block, a mismatched\ndata-URL media type, size, or digest, more than 10 attachment blocks,\nan exceeded aggregate image/context limit, or an unsupported\nreasoning effort.\n",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "../agent-host/agent-host.yaml#/components/schemas/ErrorResponse"
                    },
                    {
                      "$ref": "../../jsonschema/chat/model-selection-v2.schema.json#/$defs/Error"
                    }
                  ]
                }
              }
            }
          },
          "401": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/SessionNotFound"
          },
          "409": {
            "description": "Model admission or original operation error. `turn_active` when another turn is active; `session_not_usable` when\nthe session has no usable Runtime thread; or\n`turn_operation_conflict` when an operation ID is reused with\ndifferent canonical input.\n",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "oneOf": [
                        {
                          "$ref": "../agent-host/agent-host.yaml#/components/schemas/ErrorResponse"
                        },
                        {
                          "$ref": "../agent-host/agent-host.yaml#/components/schemas/TurnOperationConflictError"
                        }
                      ]
                    },
                    {
                      "$ref": "../../jsonschema/chat/model-selection-v2.schema.json#/$defs/Error"
                    }
                  ]
                }
              }
            }
          },
          "500": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/InternalError"
          },
          "502": {
            "$ref": "../agent-host/agent-host.yaml#/components/responses/RuntimeRequestFailed"
          },
          "503": {
            "description": "Model admission or original operation error. ",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../../jsonschema/chat/model-selection-v2.schema.json#/$defs/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "$ref": "../agent-host/agent-host.yaml#/components/parameters/AgentSessionId"
          },
          {
            "in": "header",
            "name": "X-Yijie-Model-Profile",
            "required": true,
            "schema": {
              "$ref": "../../jsonschema/chat/model-selection-v2.schema.json#/$defs/ActiveProfileId"
            }
          }
