syntax = "proto3";

package yijie.events.v2;

import "google/protobuf/timestamp.proto";
import "yijie/common/v1/common.proto";

option go_package = "github.com/36Dge/yijie-contracts/sdks/go/protobuf/yijie/events/v2;eventsv2";

enum AgentEventType {
  AGENT_EVENT_TYPE_UNSPECIFIED = 0;
  AGENT_EVENT_TYPE_THREAD_STARTED = 1;
  AGENT_EVENT_TYPE_TURN_STARTED = 2;
  AGENT_EVENT_TYPE_ITEM_STARTED = 3;
  AGENT_EVENT_TYPE_ITEM_AGENT_MESSAGE_DELTA = 4;
  AGENT_EVENT_TYPE_ITEM_COMPLETED = 5;
  AGENT_EVENT_TYPE_TURN_COMPLETED = 6;
  AGENT_EVENT_TYPE_ERROR = 7;
  AGENT_EVENT_TYPE_WARNING = 8;
  AGENT_EVENT_TYPE_ITEM_REASONING_TEXT_DELTA = 9;
  AGENT_EVENT_TYPE_ITEM_REASONING_TEXT_FINALIZED = 10;
}

enum AgentTurnStatus {
  AGENT_TURN_STATUS_UNSPECIFIED = 0;
  AGENT_TURN_STATUS_IN_PROGRESS = 1;
  AGENT_TURN_STATUS_COMPLETED = 2;
  AGENT_TURN_STATUS_INTERRUPTED = 3;
  AGENT_TURN_STATUS_FAILED = 4;
}

enum ReasoningFinalizationStatus {
  REASONING_FINALIZATION_STATUS_UNSPECIFIED = 0;
  REASONING_FINALIZATION_STATUS_COMPLETE = 1;
  REASONING_FINALIZATION_STATUS_INCOMPLETE = 2;
  REASONING_FINALIZATION_STATUS_UNAVAILABLE = 3;
}

enum ReasoningReasonCode {
  REASONING_REASON_CODE_UNSPECIFIED = 0;
  REASONING_REASON_CODE_REASONING_NOT_EMITTED = 1;
  REASONING_REASON_CODE_TURN_INTERRUPTED = 2;
  REASONING_REASON_CODE_STREAM_GAP = 3;
  REASONING_REASON_CODE_RUNTIME_ERROR = 4;
  REASONING_REASON_CODE_LIMIT_EXCEEDED = 5;
  REASONING_REASON_CODE_PROTOCOL_ERROR = 6;
  REASONING_REASON_CODE_HOST_SHUTDOWN = 7;
}

message ThreadStartedPayload {
  string model = 1;
  string model_provider = 2;
}

message TurnLifecyclePayload {
  AgentTurnStatus status = 1;
  string error_code = 2;
  string error_message = 3;
}

message ItemLifecyclePayload {
  string item_type = 1;
  string text = 2;
}

message AgentMessageDeltaPayload {
  string delta = 1;
}

message ReasoningTextDeltaPayload {
  // Zero-based Runtime content part index. Contract range: 0..7.
  uint32 content_index = 1;
  // Non-empty untrusted plain text. Contract maximum: 16 KiB UTF-8.
  string delta = 2;
}

message ReasoningContentPart {
  // Parts are unique, zero-based, contiguous, and ascending. Contract range: 0..7.
  uint32 content_index = 1;
  // Non-empty untrusted plain text. Contract maximum: 64 KiB UTF-8.
  string text = 2;
}

message ReasoningTextFinalizedPayload {
  ReasoningFinalizationStatus status = 1;
  // Authoritative Runtime completed snapshot. At most eight parts and 128 KiB UTF-8 total.
  repeated ReasoningContentPart contents = 2;
  // Absent for complete; required for incomplete and unavailable.
  optional ReasoningReasonCode reason_code = 3;
}

message AgentProblemPayload {
  string code = 1;
  string message = 2;
  bool will_retry = 3;
}

message AgentSessionEvent {
  // Always 2. Consumers negotiate v2 before the Host emits this message.
  uint32 schema_version = 1;
  string event_id = 2;
  string stream_id = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp occurred_at = 5;
  yijie.common.v1.TraceContext trace = 6;
  string task_id = 7;
  string agent_session_id = 8;
  string codex_thread_id = 9;
  string turn_id = 10;
  string item_id = 11;
  AgentEventType event_type = 12;
  // True only for turn_completed. Reasoning finalized is not turn terminal.
  bool terminal = 13;

  oneof payload {
    ThreadStartedPayload thread_started = 20;
    TurnLifecyclePayload turn_started = 21;
    ItemLifecyclePayload item_started = 22;
    AgentMessageDeltaPayload agent_message_delta = 23;
    ItemLifecyclePayload item_completed = 24;
    TurnLifecyclePayload turn_completed = 25;
    AgentProblemPayload error = 26;
    AgentProblemPayload warning = 27;
    ReasoningTextDeltaPayload reasoning_text_delta = 28;
    ReasoningTextFinalizedPayload reasoning_text_finalized = 29;
  }
}
