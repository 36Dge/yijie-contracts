syntax = "proto3";

package yijie.events.v1;

import "google/protobuf/timestamp.proto";
import "yijie/common/v1/common.proto";

option go_package = "github.com/36Dge/yijie-contracts/sdks/go/protobuf/yijie/events/v1;eventsv1";

enum AgentSessionState {
  AGENT_SESSION_STATE_UNSPECIFIED = 0;
  AGENT_SESSION_STATE_STARTING = 1;
  AGENT_SESSION_STATE_IDLE = 2;
  AGENT_SESSION_STATE_ACTIVE = 3;
  AGENT_SESSION_STATE_FAILED = 4;
}

enum AgentEventType {
  AGENT_EVENT_TYPE_UNSPECIFIED = 0;
  AGENT_EVENT_TYPE_THREAD_STARTED = 1;
  AGENT_EVENT_TYPE_TURN_STARTED = 2;
  AGENT_EVENT_TYPE_ITEM_STARTED = 3;
  AGENT_EVENT_TYPE_ITEM_AGENT_MESSAGE_DELTA = 4;
  AGENT_EVENT_TYPE_ITEM_COMPLETED = 5;
  AGENT_EVENT_TYPE_TURN_COMPLETED = 6;
  AGENT_EVENT_TYPE_ERROR = 7;
  AGENT_EVENT_TYPE_WARNING = 8;
}

enum AgentTurnStatus {
  AGENT_TURN_STATUS_UNSPECIFIED = 0;
  AGENT_TURN_STATUS_IN_PROGRESS = 1;
  AGENT_TURN_STATUS_COMPLETED = 2;
  AGENT_TURN_STATUS_INTERRUPTED = 3;
  AGENT_TURN_STATUS_FAILED = 4;
}

message AgentSession {
  string task_id = 1;
  string agent_session_id = 2;
  string codex_thread_id = 3;
  string active_turn_id = 4;
  AgentSessionState state = 5;
  string cwd = 6;
  string model = 7;
  string model_provider = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Stable, sanitized failure reason. Present only when state is AGENT_SESSION_STATE_FAILED.
  optional string failure_code = 11;
}

message ThreadStartedPayload {
  string model = 1;
  string model_provider = 2;
}

message TurnLifecyclePayload {
  // turn_started requires AGENT_TURN_STATUS_IN_PROGRESS. turn_completed requires
  // AGENT_TURN_STATUS_COMPLETED, AGENT_TURN_STATUS_INTERRUPTED, or
  // AGENT_TURN_STATUS_FAILED.
  AgentTurnStatus status = 1;
  // Only turn_completed may carry a sanitized error code and message.
  string error_code = 2;
  string error_message = 3;
}

message ItemLifecyclePayload {
  string item_type = 1;
  string text = 2;
}

message AgentMessageDeltaPayload {
  string delta = 1;
}

message AgentProblemPayload {
  string code = 1;
  string message = 2;
  // Warning events require false. Error events preserve the Runtime retry signal.
  bool will_retry = 3;
}

message AgentSessionEvent {
  uint32 schema_version = 1;
  string event_id = 2;
  string stream_id = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp occurred_at = 5;
  yijie.common.v1.TraceContext trace = 6;
  string task_id = 7;
  string agent_session_id = 8;
  string codex_thread_id = 9;
  // Required for turn_started, turn_completed, item events, and error.
  string turn_id = 10;
  // Required only for item_started, agent_message_delta, and item_completed.
  string item_id = 11;
  AgentEventType event_type = 12;
  // True only for turn_completed. Error and warning events are informational.
  bool terminal = 13;

  // The populated field must correspond to event_type. JSON/SSE consumers use
  // jsonschema/agent/session-event.schema.json, which enforces this pairing.
  oneof payload {
    ThreadStartedPayload thread_started = 20;
    TurnLifecyclePayload turn_started = 21;
    ItemLifecyclePayload item_started = 22;
    AgentMessageDeltaPayload agent_message_delta = 23;
    ItemLifecyclePayload item_completed = 24;
    TurnLifecyclePayload turn_completed = 25;
    AgentProblemPayload error = 26;
    AgentProblemPayload warning = 27;
  }
}
